<h1>Kebijakan Privasi</h1>
<p>Aplikasi ini hanya dipakai pemilik toko untuk mengunggah file cadangan ERP yang sudah terenkripsi ke Google Drive miliknya sendiri.</p>
<p>Aplikasi hanya mengakses file yang dibuatnya sendiri (izin drive.file), tidak membaca file lain, dan tidak membagikan data kepada pihak mana pun.</p>
